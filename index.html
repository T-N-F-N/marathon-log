<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>42.195 Log</title>
<meta name="description" content="フルマラソン当日までの練習プランと実績、食事の注意点を管理するアプリ">
<meta name="theme-color" content="#f3f5fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121626" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="42.195 Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column like a training notebook; race-bib countdown on top, fixed tab bar at the bottom. */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --sunken:#e8ecf5; --line:#d5dbe8;
  --ink:#1b2347; --muted:#5d6788; --accent:#2b57c4; --accent-ink:#ffffff; --accent-soft:#e3eafb;
  --bib:#ffffff; --bib-num:#1b2347; --bib-band:#2b57c4;
  --ok:#1f8a5b; --ok-soft:#dff3e9; --warn:#b26a00; --warn-soft:#fbeed7; --miss:#c23b3b; --miss-soft:#f8e1e1;
  --t-rest:#8a93ad; --t-jog:#3f8fd6; --t-point:#5b3fc4; --t-long:#c2701c; --t-tune:#1f8a8a; --t-race:#c23b3b;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121626; --surface:#1b2034; --sunken:#252b43; --line:#323a58;
  --ink:#e9ecf7; --muted:#9aa3c2; --accent:#7aa0ff; --accent-ink:#0f1430; --accent-soft:#25305a;
  --bib:#f4f5f9; --bib-num:#1b2347; --bib-band:#2b57c4;
  --ok:#5cc996; --ok-soft:#173a2c; --warn:#f0a948; --warn-soft:#3d2e14; --miss:#f07b7b; --miss-soft:#422020;
  --t-rest:#7d86a3; --t-jog:#6fb3f0; --t-point:#a48cff; --t-long:#f0a052; --t-tune:#55c4c4; --t-race:#f07b7b;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121626; --surface:#1b2034; --sunken:#252b43; --line:#323a58;
  --ink:#e9ecf7; --muted:#9aa3c2; --accent:#7aa0ff; --accent-ink:#0f1430; --accent-soft:#25305a;
  --bib:#f4f5f9; --bib-num:#1b2347; --bib-band:#2b57c4;
  --ok:#5cc996; --ok-soft:#173a2c; --warn:#f0a948; --warn-soft:#3d2e14; --miss:#f07b7b; --miss-soft:#422020;
  --t-rest:#7d86a3; --t-jog:#6fb3f0; --t-point:#a48cff; --t-long:#f0a052; --t-tune:#55c4c4; --t-race:#f07b7b;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--f-body);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px;display:grid;gap:18px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
h2{font-size:1.15rem}
h3{font-size:1rem}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;letter-spacing:.08em;color:var(--muted);font-weight:700}
.stack{display:grid;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-family:var(--f-num);font-weight:700;font-size:1.35rem;letter-spacing:.02em}
.brand span{color:var(--accent)}
.save-state{font-size:.75rem;color:var(--muted)}

/* race bib */
.bib{position:relative;background:var(--bib);color:var(--bib-num);border-radius:10px;padding:14px 18px 16px;
  box-shadow:0 1px 0 rgba(0,0,0,.04),0 8px 24px -12px rgba(27,35,71,.35);overflow:hidden}
.bib::before,.bib::after{content:"";position:absolute;top:10px;width:10px;height:10px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.bib::before{left:10px}.bib::after{right:10px}
.bib .pins-b::before,.bib .pins-b::after{content:"";position:absolute;bottom:10px;width:10px;height:10px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.bib .pins-b::before{left:10px}.bib .pins-b::after{right:10px}
.bib-band{background:var(--bib-band);color:#fff;margin:-14px -18px 10px;padding:6px 30px;font-size:.78rem;font-weight:700;letter-spacing:.06em;display:flex;justify-content:space-between;gap:8px}
.bib-main{display:flex;align-items:flex-end;justify-content:center;gap:6px}
.bib-days{font-family:var(--f-num);font-weight:700;font-size:clamp(4.2rem,22vw,6.5rem);line-height:.9;font-variant-numeric:tabular-nums}
.bib-unit{font-weight:700;padding-bottom:10px}
.bib-sub{text-align:center;font-size:.85rem;color:#4b5578}
.bib-goal{display:flex;justify-content:center;gap:18px;margin-top:6px;font-size:.8rem;color:#4b5578;flex-wrap:wrap}
.bib-goal b{font-family:var(--f-num);font-size:1.1rem;color:var(--bib-num)}

/* chips & status */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--sunken);white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.st{font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.st-done{background:var(--ok-soft);color:var(--ok)}
.st-part{background:var(--warn-soft);color:var(--warn)}
.st-miss{background:var(--miss-soft);color:var(--miss)}
.st-todo{background:var(--sunken);color:var(--muted)}

/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--miss)}
.btn.wide{width:100%}
.btn:active{transform:translateY(1px)}

/* today card */
.today-main{display:grid;gap:6px}
.big-dist{font-family:var(--f-num);font-weight:700;font-size:2.4rem;line-height:1}
.big-dist small{font-size:1rem;font-weight:600;margin-left:2px}

/* progress */
.bar{height:10px;border-radius:999px;background:var(--sunken);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px}

/* plan list */
.week{display:grid;gap:6px}
.week-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 2px}
.day{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.day.is-today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day.is-past{opacity:.85}
.day-date{display:grid;justify-items:center;line-height:1.1}
.day-date .d{font-family:var(--f-num);font-size:1.5rem;font-weight:700}
.day-date .w{font-size:.72rem;color:var(--muted)}
.day-date .w.sun{color:var(--miss)}.day-date .w.sat{color:var(--accent)}
.day-body{min-width:0;display:grid;gap:2px}
.day-title{font-weight:700;overflow-wrap:anywhere}
.day-detail{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.day-side{display:grid;justify-items:end;gap:4px}
.day-km{font-family:var(--f-num);font-weight:600;font-size:1.1rem}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{appearance:none;background:none;border:0;padding:8px 2px 10px;display:grid;justify-items:center;gap:2px;font-size:.7rem;font-weight:700;color:var(--muted);cursor:pointer}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--accent)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,30,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.sheet-grip{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunken);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 4px;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* forms */
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:.78rem;font-weight:700;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-height:42px;font-size:16px}
textarea.inp{min-height:72px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}}

/* food */
.phase{border-left:4px solid var(--pc,var(--accent));padding-left:12px;display:grid;gap:8px}
.phase.now{background:var(--accent-soft);border-radius:0 12px 12px 0;padding:12px}
.tip-list{margin:0;padding-left:1.2em;display:grid;gap:4px}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.calc div{background:var(--sunken);border-radius:10px;padding:10px;display:grid;gap:2px}
.calc b{font-family:var(--f-num);font-size:1.4rem;line-height:1.1}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sunken);border-radius:10px;padding:10px;display:grid;gap:0}
.stat b{font-family:var(--f-num);font-size:1.6rem;line-height:1.1}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ホームのヒーロー：神戸の夜の港をイメージした紺。両テーマ共通の一つの見た目にする */
:root{--hero-bg1:#0d1838;--hero-bg2:#1f3f8f;--hero-ink:#f4f6fd;--hero-sub:#b9c4e6;--hero-accent:#ffb547;--hero-line:#5f77b8}
.hero{position:relative;border-radius:18px;overflow:hidden;color:var(--hero-ink);
  background:radial-gradient(120% 90% at 100% 0%, var(--hero-bg2) 0%, var(--hero-bg1) 62%);
  box-shadow:0 14px 34px -18px rgba(13,24,56,.7);display:grid;gap:10px;padding:0 0 16px}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,181,71,.22), rgba(255,181,71,0) 70%);pointer-events:none}
.hero-band{display:flex;justify-content:space-between;gap:8px;padding:10px 18px;font-size:.78rem;font-weight:700;letter-spacing:.08em;
  background:rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.1)}
.hero-race{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-main{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:4px 18px 0;flex-wrap:wrap}
.hero-count{display:grid;gap:0}
.hero-lbl{font-size:.7rem;font-weight:700;letter-spacing:.14em;color:var(--hero-sub)}
.hero-days{font-family:var(--f-num);font-weight:700;font-size:clamp(5rem,30vw,8rem);line-height:.86;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hero-days small{font-size:1.4rem;font-weight:600;margin-left:6px;letter-spacing:0;color:var(--hero-sub)}
.hero-days.is-today{font-size:clamp(3.6rem,20vw,5.5rem);color:var(--hero-accent)}
.hero-sub{font-size:.82rem;color:var(--hero-sub);font-weight:500;margin-top:4px}
.hero-goal{display:grid;justify-items:end;gap:0;padding-bottom:6px}
.hero-goal b{font-family:var(--f-num);font-size:2rem;line-height:1;color:var(--hero-accent)}
.hero-goal span.num{font-family:var(--f-num);font-size:1.05rem;color:var(--hero-sub)}
.hero-goal small{font-size:.75rem;margin-left:1px}
.hero-journey{padding:0 12px;display:grid;gap:0}
.journey{width:100%;height:auto;display:block;overflow:visible}
.journey-lbl{display:flex;justify-content:space-between;font-size:.68rem;color:var(--hero-sub);padding:0 6px;gap:6px}
.journey-lbl span:nth-child(2){color:var(--hero-accent);font-weight:700;font-family:var(--f-num);font-size:.85rem}
.hero-msg{margin:0 18px;font-size:1.02rem;font-weight:700;line-height:1.55;text-wrap:balance}
.hero-from{display:block;font-size:.68rem;letter-spacing:.14em;color:var(--hero-accent);font-weight:700;margin-bottom:2px}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);margin:0 12px;border-top:1px solid rgba(255,255,255,.12);padding-top:10px}
.hero-stats div{display:grid;justify-items:center;gap:0}
.hero-stats div+div{border-left:1px solid rgba(255,255,255,.12)}
.hero-stats b{font-family:var(--f-num);font-size:1.6rem;line-height:1.1}
.hero-stats span{font-size:.7rem;color:var(--hero-sub);font-weight:700}
@media (prefers-reduced-motion:no-preference){ #jDot{animation:pulse 2.4s ease-in-out infinite} @keyframes pulse{50%{r:9}} }

.top-right{display:flex;align-items:center;gap:8px;min-width:0}
.count-chip{font-size:.78rem;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 10px;white-space:nowrap}
.count-chip b{font-family:var(--f-num);font-size:1rem;margin:0 2px}
.admin-chip{font-family:var(--f-body);font-size:.68rem;font-weight:700;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:1px 6px;vertical-align:3px}
.new-dot{font-size:.66rem;font-weight:700;letter-spacing:.06em;background:var(--miss);color:#fff;border-radius:999px;padding:1px 8px}
.tab{position:relative}
.tab.has-new::after{content:"";position:absolute;top:6px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--miss)}
.cm-chip{font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.cm-chip.is-new{background:var(--miss);color:#fff}
.cm-box{border-left:3px solid var(--warn);background:var(--warn-soft);border-radius:0 10px 10px 0;padding:8px 12px;display:grid;gap:2px}
.cm-box p{margin:0;font-size:.9rem;overflow-wrap:anywhere}
.cm-panel{border-color:var(--warn)}
.cm-item{display:grid;gap:2px;text-align:left;background:var(--sunken);border:0;border-radius:10px;padding:8px 12px;cursor:pointer}
.cm-item span{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.cm-edit textarea{border-color:var(--warn)}
.admin-panel{border-color:var(--warn);background:linear-gradient(0deg,var(--surface),var(--surface)),var(--warn-soft)}
.adv-panel{border-color:var(--accent)}
.adv-mini{display:grid;gap:2px}
.adv-mini p{margin:0;overflow-wrap:anywhere}
.adv-sec.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.adv-text{margin:0;overflow-wrap:anywhere;line-height:1.8}
.checks{display:grid;gap:2px}
.check{display:flex;gap:10px;align-items:center;padding:6px 2px;border-bottom:1px solid var(--line);font-size:.92rem}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.check input:checked+span{color:var(--muted);text-decoration:line-through}
details.phase{display:block}
details.phase summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:4px 0}
details.phase summary::-webkit-details-marker{display:none}
details.phase .tip-list{margin-top:6px}
.run-box{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;background:var(--surface)}
.day-warn{font-size:.75rem;color:var(--warn);font-weight:700}
.log-item{text-align:left;cursor:pointer;gap:6px}
.move-box summary{cursor:pointer}

/* 実践モード：走りながら見る画面。屋外で読みやすく電池にやさしい暗い画面に固定 */
.run{
  --rb:#0c0f1d; --rs:#171b30; --rl:#2a3150; --ri:#f3f5fb; --rm:#a3abc8; --ra:#7aa0ff; --rg:#5cd69b; --rr:#ff8a7a;
  position:fixed;inset:0;z-index:30;background:var(--rb);color:var(--ri);overflow:auto;color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.rm-in{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 28px;display:grid;gap:12px}
.rm-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rm-gps{font-size:.78rem;color:var(--rm);text-align:center;min-width:0;overflow-wrap:anywhere}
.rm-main{display:grid;justify-items:center;gap:0;padding-block:4px}
.rm-dist{font-family:var(--f-num);font-weight:700;font-size:clamp(4.5rem,26vw,7.5rem);line-height:.95;font-variant-numeric:tabular-nums}
.rm-dist small{font-size:1.4rem;font-weight:600;color:var(--rm);margin-left:4px}
.rm-time{font-size:2rem;font-weight:600;color:var(--rm)}
.rm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rm-grid.two{grid-template-columns:1fr 1fr}
.rm-grid>div{background:var(--rs);border-radius:12px;padding:8px 10px;display:grid}
.rm-grid span{font-size:.72rem;color:var(--rm);font-weight:700}
.rm-grid b{font-family:var(--f-num);font-size:1.7rem;line-height:1.15;font-variant-numeric:tabular-nums}
.run .good{color:var(--rg)} .run .bad{color:var(--rr)}
.rm-card{background:var(--rs);border:1px solid var(--rl);border-radius:14px;padding:12px;display:grid;gap:8px}
.rm-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.rm-row span{color:var(--rm);font-size:.85rem}
.rm-row b{font-family:var(--f-num);font-size:1.3rem;font-variant-numeric:tabular-nums}
.rm-row em{font-style:normal;margin-left:6px}
.rm-bar{height:8px;border-radius:99px;background:var(--rl);overflow:hidden}
.rm-bar i{display:block;height:100%;background:var(--ra)}
.rm-said{font-size:.85rem;color:var(--rm);min-height:1.4em;margin:0}
.rm-actions{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px}
.rm-btn{appearance:none;border:1px solid var(--rl);background:var(--rs);color:var(--ri);border-radius:14px;min-height:52px;padding:10px 14px;font-weight:700;font-size:1rem;cursor:pointer}
.rm-btn.ghost{min-height:42px;font-size:.88rem;background:transparent}
.rm-btn.go{background:var(--rg);border-color:var(--rg);color:#06140d;min-height:64px;font-size:1.25rem}
.rm-btn.stop{background:transparent;border-color:var(--rr);color:var(--rr)}
.rm-btn:disabled{opacity:.4}
.rm-map{height:38vh;min-height:220px;border-radius:14px;overflow:hidden;background:var(--rs);display:grid;place-items:center}
.rm-laps{overflow-x:auto}
.rm-laps table{width:100%;border-collapse:collapse;font-family:var(--f-num);font-size:1.05rem;font-variant-numeric:tabular-nums}
.rm-laps th{font-family:var(--f-body);font-size:.72rem;color:var(--rm);text-align:right;padding:4px 6px;border-bottom:1px solid var(--rl)}
.rm-laps td{text-align:right;padding:5px 6px;border-bottom:1px solid var(--rl)}
.rm-laps th:first-child,.rm-laps td:first-child{text-align:left}
.rm-help ul{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:.85rem;color:var(--rm)}
.run .inp{background:var(--rb);border-color:var(--rl);color:var(--ri)}
.run .field>span{color:var(--rm)}
.rs-row{display:grid;grid-template-columns:5em auto 1fr auto auto;gap:6px;align-items:center}
.rs-row.gate{grid-template-columns:1fr 4.5em 6.5em auto}
@media (max-width:380px){.rs-row.gate{grid-template-columns:1fr 4em auto}.rs-row.gate input[type=time]{grid-column:1 / 3}}
.rm-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--rs);border-radius:12px;padding:4px}
.rm-seg button{border:0;background:transparent;color:var(--rm);border-radius:9px;padding:10px 6px;font-weight:700;cursor:pointer;font-size:.9rem;overflow-wrap:anywhere}
.rm-seg button[aria-pressed="true"]{background:var(--ra);color:#0c0f1d}
.rm-modechip{justify-self:center;font-size:.8rem;font-weight:700;color:var(--ra);border:1px solid var(--rl);border-radius:999px;padding:3px 12px}
.rm-msg{background:#3a2a10;border:1px solid #ffb547;border-radius:14px;padding:10px 12px;display:grid;gap:4px}
.rm-msg .label{color:#ffb547}
.rm-msg p{margin:0;font-size:1.1rem;font-weight:700}
.rm-plan{font-family:var(--f-body)!important;font-size:.95rem!important}
.pc-bulk{display:grid;grid-template-columns:3.2em auto 3.2em auto 1fr;gap:6px;align-items:center}
.pc-bulk .rm-btn{grid-column:1 / -1;min-height:40px}
.pc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.pc-grid label{display:grid;gap:2px;font-size:.72rem;color:var(--rm);font-weight:700}
.wm-quick{display:flex;flex-wrap:wrap;gap:6px}
.wm-quick .rm-btn{min-height:38px;font-size:.82rem;padding:6px 10px}
.wm-link{display:grid;place-items:center;text-decoration:none}
.lap-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.85rem}
.lap-table td,.lap-table th{padding:3px 6px;border-bottom:1px solid var(--line);text-align:right}
.lap-table th{color:var(--muted);font-size:.72rem}
.lap-table td:first-child,.lap-table th:first-child{text-align:left}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.85rem;font-weight:700;z-index:60}
.note{font-size:.8rem;color:var(--muted);background:var(--sunken);border-radius:10px;padding:10px 12px}
.empty{text-align:center;padding:24px 12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<nav class="tabs" aria-label="メニュー">
  <div class="tabs-in" role="tablist">
    <button class="tab" role="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>今日</button>
    <button class="tab" role="tab" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>プラン</button>
    <button class="tab" role="tab" data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>記録</button>
    <button class="tab" role="tab" data-tab="advice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h7M8.5 14.5h4"/></svg>アドバイス</button>
    <button class="tab" role="tab" data-tab="setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>設定</button>
  </div>
</nav>

<div id="runMode" class="run" hidden></div>

<script src="app.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
